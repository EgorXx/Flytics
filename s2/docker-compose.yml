#  postgres-replica2:
#    image: postgres:17
#    environment:
#      POSTGRES_PASSWORD: qwerty007
#      PGDATA: /var/lib/postgresql/data
#    ports:
#      - "5434:5432"
#    entrypoint: [ "/bin/bash", "/replication/replica-init.sh" ]
#    volumes:
#      - replica2_data:/var/lib/postgresql/data
#      - ./replication/replica-init.sh:/replication/replica-init.sh
#    depends_on:
#      - postgres-master

  flyway:
    image: flyway/flyway
    depends_on:
      - postgres-master
    command:
      - "migrate"
      - "-baselineOnMigrate=true"
      - "-connectRetries=60"
    volumes:
      - ./migrations:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres-master:5432/flytics
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: qwerty007
      FLYWAY_BASELINE_VERSION: 1
      FLYWAY_BASELINE_DESCRIPTION: "Initial baseline"
      FLYWAY_SCHEMAS: public

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres-master

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:qwerty007@postgres-master:5432/flytics?sslmode=disable"
    volumes:
      - ./monitoring/queries.yaml:/queries.yaml
    command:
      - "--extend.query-path=/queries.yaml"
      - "--collector.stat_statements"
      - "--collector.stat_statements.query_length=300"
      - "--collector.stat_statements.limit=500"
    ports:
      - "9187:9187"
    depends_on:
      - postgres-master

  prometheus:
    image: prom/prometheus
    ports:
       - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - postgres_exporter

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  master_data:
  replica1_data:
  replica2_data:
  subscriber_data: